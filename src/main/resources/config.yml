# ===================================================================
#  STXAntiCheat – yapılandırma
#  VARSAYILAN DAVRANIŞ: yalnızca kaydet ve staff'a bildir. Ceza KAPALI.
#  Cezayı açmadan önce logs/ klasöründeki "WOULD_PUNISH" kayıtlarını
#  inceleyin; hiç yanlış pozitif görmüyorsanız punishment bölümünü açın.
# ===================================================================

general:
  debug: false
  disabled-worlds: []            # kontrollerin kapalı olacağı dünyalar
  bedrock-prefix: "."            # Geyser/Floodgate isim öneki ("" = kapalı)
  bedrock-relaxed: true          # Bedrock oyuncularında Rotation/Aim/AutoClicker/Scaffold-ışın kapalı
  bypass-permission: "stx.bypass"

# Lag / bağlantı güvenliği: bu koşullarda KANIT ÜRETİLMEZ.
safety:
  max-ping-ms: 400
  min-tps: 18.0
  join-grace-ticks: 100
  teleport-grace-ticks: 30
  respawn-grace-ticks: 60
  flight-toggle-grace-ticks: 80
  gamemode-grace-ticks: 40
  glide-end-grace-ticks: 40
  riptide-grace-ticks: 60
  vehicle-exit-grace-ticks: 20
  ping-jump-ms: 120              # iki saniye arasında ping bu kadar sıçrarsa kısa süre atla
  ping-jump-grace-ticks: 60

# Şüphe puanı: her kanıt (weight x check-weight) puan ekler, zamanla azalır.
suspicion:
  decay-per-second: 0.15
  alert-points-per-check: 4      # bir kontrolün puanı bunu aşınca staff'a bildir
  alert-cooldown-seconds: 3

# Staff / OP bildirimleri
alerts:
  notify-ops: true               # OP olan oyuncular (stx.alerts izni olmasa da) uyarı alır
  ops-see-all-evidence: true     # OP'ler puan eşiğine bakılmadan HER kanıtı görür
  notify-when-not-punished: true # ceza eşiği aşıldı ama oyuncu atılmadıysa (ceza kapalı) OP'lere bildir

# ===== Kademeli müdahale =====
# Her kontrol bağımsız puan toplar. Puan "confirm-points" üstüne çıkarsa bir İHLAL sayılır (en fazla dakikada bir,
# kalıcı ve UUID bazlı). Düşük puan = yalnızca kayıt.
#   1. ihlal -> geçici müdahale (örn. 15 sn saldırı/hareket engeli)      (1/3)
#   2. ihlal -> daha uzun kısıtlama                                      (2/3)
#   3. ihlal -> BAN, ama yalnızca: ban-uygun hile + HIGH kanıt + en az N bağımsız hile türü + ban kilidi açık (3/3)
sanctions:
  mitigation-enabled: true       # geçici, kendiliğinden biten müdahaleler (güvenli)
  ban-enabled: false             # KALICI BAN KİLİDİ. Kapalıyken kimse atılmaz/banlanmaz; WOULD_BAN olarak loglanır.
  i-have-reviewed-the-logs: false # ikinci emniyet: loglar incelendi mi? İkisi de true olmadan BAN YOK.
  min-distinct-checks-for-ban: 2
  save-interval-seconds: 300
  ban-command: "ban %player% %reason%"
  default:
    confirm-points: 6            # ihlal sayılması için kontrol puanı (MEDIUM)
    strong-points: 14            # güçlü kanıt (HIGH) – ban için gerekli
    violations-to-restrict: 2
    violations-to-ban: 3
    expire-hours: 72             # ihlaller bu süre sonunda sayılmaz (yanlış pozitif birikmesin)
    violation-cooldown-seconds: 60
    mitigation-seconds: 15
    restrict-seconds: 30

logging:
  file: true                     # plugins/STXAntiCheat/logs/stx-YYYY-MM-DD.jsonl
  console: false
  console-min-total: 8
  keep-days: 14
  queue-size: 20000

# Her kontrol: enabled, weight (kanıt başına puan çarpanı) + kontrol özel ayarlar.
checks:
  Reach:
    enabled: true
    weight: 1.0
    tolerance: 0.30              # hedefin ping penceresindeki en yakın konumundan sonra eklenen pay
    buffer: 6
    mob-extra: 0.30
    cancel-margin: 0.50          # bu kadar açık aşımda vuruş anında iptal edilir
    mitigation: ATTACK
    ban-eligible: true
  Aim:                           # bakış ışını hedefi ıskalıyor (rotasyonsuz Aura, HitBox)
    enabled: true
    weight: 1.0
    expand: 0.15
    buffer: 7
    mitigation: ATTACK
    ban-eligible: true
  Aura:                          # çoklu hedef, snap, duvar arkası
    enabled: true
    weight: 1.0
    multi-targets: 3
    multi-ticks: 5
    flick-degrees: 60
    wall-check: true
    mitigation: ATTACK
    ban-eligible: true
  AutoClicker:
    enabled: true
    weight: 1.0
    max-cps: 22
    sustain-seconds: 3
    consistency-samples: 40
    consistency-min-stddev: 0.35
    mitigation: ATTACK
    ban-eligible: false
  Velocity:                      # Anti-Knockback
    enabled: true
    weight: 1.0
    min-ratio: 1.2               # vanilla en kötü durumda ≈4.7 ölçüldü
    buffer: 3
    mitigation: NONE
    ban-eligible: false
  Fly:                           # Fly, Hover, FastFall
    enabled: true
    weight: 1.0
    hover-ticks: 8
    max-rise: 1.32
    mitigation: MOVE
    ban-eligible: true
  Step:
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: true
  HighJump:
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: true
  Speed:
    enabled: true
    weight: 1.0
    margin: 0.10                 # vanilla (sprint+bhop) limitlerinin üstüne tolerans
    ice-multiplier: 2.2
    mitigation: MOVE
    ban-eligible: true
  Timer:                         # Timer / TickShift / paket patlaması
    enabled: true
    weight: 1.0
    max-credit-ms: 800
    tolerance-ms: 100
    mitigation: MOVE
    ban-eligible: true
  NoFall:
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: true
  NoSlow:
    enabled: true
    weight: 1.0
    limit: 0.12
    mitigation: MOVE
    ban-eligible: true
  Scaffold:
    enabled: true
    weight: 1.0
    rate-per-20-ticks: 14
    mitigation: PLACE
    ban-eligible: true
  Criticals:
    enabled: true
    weight: 1.0
    mitigation: ATTACK
    ban-eligible: false
  ChestStealer:
    enabled: true
    weight: 1.0
    min-open-ticks: 3
    samples: 12
    min-stddev: 0.3
    mitigation: CONTAINER
    ban-eligible: false
  GuiMove:
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: false
  Rotation:                      # fare kuantizasyonu (GCD); sinematik kamera/özel istemcilerde yanlış pozitif olabilir
    enabled: true
    weight: 0.4
    window: 40
    min-step: 0.005
    mitigation: NONE
    ban-eligible: false
  Phase:
    enabled: true
    weight: 0.6
    mitigation: MOVE
    ban-eligible: true
  Jesus:                         # sıvı yüzeyinde yürüme
    enabled: true
    weight: 1.0
    ticks: 12
    mitigation: MOVE
    ban-eligible: true
  Spider:                        # duvara tırmanma (Fly sapması duvar yanındaysa)
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: true
