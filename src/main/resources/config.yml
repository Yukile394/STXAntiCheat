# ===================================================================
#  STXAntiCheat – yapılandırma
#  Akış: kanıt -> log + (anında kısa engel) -> ihlal (1/3, 2/3) -> 3/3'te süreli ban.
#  Yanlış pozitif görürseniz: /stx reset <oyuncu> ve ilgili kontrolün weight/eşiğini düşürün
#  veya checks.<Ad>.enabled: false yapın. Banı tamamen kapatmak için sanctions.ban-enabled: false.
# ===================================================================

general:
  debug: false
  disabled-worlds: []            # kontrollerin kapalı olacağı dünyalar
  bedrock-prefix: "."            # Geyser/Floodgate isim öneki ("" = kapalı)
  bedrock-relaxed: true          # Bedrock oyuncularında Rotation/Aim/AutoClicker/Scaffold-ışın kapalı
  bypass-permission: "stx.bypass"

# Lag / bağlantı güvenliği: bu koşullarda KANIT ÜRETİLMEZ.
safety:
  max-ping-ms: 400
  min-tps: 18.0
  join-grace-ticks: 100
  teleport-grace-ticks: 30
  respawn-grace-ticks: 60
  flight-toggle-grace-ticks: 80
  gamemode-grace-ticks: 40
  glide-end-grace-ticks: 40
  riptide-grace-ticks: 60
  vehicle-exit-grace-ticks: 20
  ping-jump-ms: 120              # iki saniye arasında ping bu kadar sıçrarsa kısa süre atla
  ping-jump-grace-ticks: 60

# Şüphe puanı: her kanıt (weight x check-weight) puan ekler, zamanla azalır.
suspicion:
  decay-per-second: 0.15
  alert-points-per-check: 4      # bir kontrolün puanı bunu aşınca staff'a bildir
  alert-cooldown-seconds: 3

# Staff / OP bildirimleri
alerts:
  notify-ops: true               # OP olan oyuncular (stx.alerts izni olmasa da) uyarı alır
  ops-see-all-evidence: true     # OP'ler puan eşiğine bakılmadan HER kanıtı görür
  notify-when-not-punished: true # ceza eşiği aşıldı ama oyuncu atılmadıysa (ceza kapalı) OP'lere bildir

# ===== Kademeli müdahale =====
# Her kontrol bağımsız puan toplar. Puan "confirm-points" üstüne çıkarsa bir İHLAL sayılır (en fazla dakikada bir,
# kalıcı ve UUID bazlı). Düşük puan = yalnızca kayıt.
#   1. ihlal -> geçici müdahale (örn. 15 sn saldırı/hareket engeli)      (1/3)
#   2. ihlal -> daha uzun kısıtlama                                      (2/3)
#   3. ihlal -> BAN, ama yalnızca: ban-uygun hile + HIGH kanıt + en az N bağımsız hile türü + ban kilidi açık (3/3)
sanctions:
  mitigation-enabled: true       # geçici, kendiliğinden biten müdahaleler
  ban-enabled: true              # 3/3'te süreli ban (kapatmak için false)
  ban-duration-days: 7           # ban süresi (gün). UUID bazlı, sunucu yeniden başlasa da sürer.
  min-distinct-checks-for-ban: 1 # ban için kaç farklı hile türünde ihlal gerekir (1 = tek hile türü yeter)
  save-interval-seconds: 300
  # Log düştüğü ANDA devreye giren kısa engeller (ihlal sayacından bağımsız):
  #   saldırı/blok/konteyner hileleri: işlem iptal edilir | hareket hileleri: geri alma + yerinde dondurma
  instant:
    enabled: true
    min-points: 2                # kontrolün puanı bu değere ulaşınca (en az 2 kanıt) devreye girer
    block-seconds: 3             # saldırı / blok koyma / konteyner engeli süresi
    move-freeze-seconds: 3       # hareket dondurma süresi (yerinden oynayamaz, yukarı çıkamaz)
    hot-seconds: 30              # yakalanan hareket hilesinde bu süre boyunca "hot": buffer %66 küçülür, her ihlal anında geri alınır
                                 # (hile açıkken sürekli geri alınır; 3-4 sn serbest kullanım kalmaz)
  default:
    confirm-points: 6            # ihlal sayılması için kontrol puanı (MEDIUM)
    strong-points: 14            # güçlü kanıt (HIGH) – ban için gerekli
    violations-to-restrict: 2
    violations-to-ban: 3
    expire-hours: 72             # ihlaller bu süre sonunda sayılmaz
    violation-cooldown-seconds: 30
    mitigation-seconds: 15
    restrict-seconds: 30

logging:
  file: true                     # plugins/STXAntiCheat/logs/stx-YYYY-MM-DD.jsonl
  console: false
  console-min-total: 8
  keep-days: 14
  queue-size: 20000

# Her kontrol: enabled, weight (kanıt başına puan çarpanı) + kontrol özel ayarlar.
checks:
  Reach:
    enabled: true
    weight: 1.0
    tolerance: 0.30              # hedefin ping penceresindeki en yakın konumundan sonra eklenen pay
    buffer: 6
    mob-extra: 0.30
    cancel-margin: 0.50          # bu kadar açık aşımda vuruş anında iptal edilir
    mitigation: ATTACK
    ban-eligible: true
    instant: true
  Aim:                           # bakış ışını hedefi ıskalıyor (rotasyonsuz Aura, HitBox)
    enabled: true
    weight: 1.0
    expand: 0.15
    buffer: 7
    mitigation: ATTACK
    ban-eligible: true
    instant: true
  Aura:                          # çoklu hedef, snap, duvar arkası
    enabled: true
    weight: 1.0
    multi-targets: 3
    multi-ticks: 5
    flick-degrees: 60
    wall-check: true             # HER vuruşta duvar kontrolü; kapalıysa vuruş anında iptal edilir
    angle-cancel-degrees: 70     # bakış hedeften bu kadar saparsa vuruş anında iptal
    tracking-window: 60          # açık alan: strafe eden oyuncu hedefte kros-hair kalıcılığı (tik)
    tracking-min-on-target: 0.985
    tracking-min-bearing: 2.0    # hedefin açısal hızı (derece/tik); düz kovalamada sayılmaz
    snap-degrees: 35             # izole rotasyon snap'i (öncesi/sonrası sabit) eşiği
    snap-count: 5
    snap-window-ticks: 80
    confirm-points: 4            # Aura için daha hassas
    strong-points: 10
    mitigation: ATTACK
    ban-eligible: true
    instant: true
  AutoClicker:
    enabled: true
    weight: 1.0
    max-cps: 22
    sustain-seconds: 3
    consistency-samples: 40
    consistency-min-stddev: 0.35
    mitigation: ATTACK
    ban-eligible: false
    instant: false
  Velocity:                      # Anti-Knockback
    enabled: true
    weight: 1.0
    min-ratio: 1.2               # vanilla en kötü durumda ≈4.7 ölçüldü
    buffer: 3
    mitigation: NONE
    ban-eligible: false
    instant: false
  Fly:                           # Fly, Hover, FastFall
    enabled: true
    weight: 1.0
    hover-ticks: 8
    max-rise: 1.32
    mitigation: MOVE
    ban-eligible: true
    instant: true
  Step:
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: true
    instant: true
  HighJump:
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: true
    instant: true
  Speed:
    enabled: true
    weight: 1.0
    margin: 0.30                 # DIŞ güvenlik sınırı (yalnızca absürt hızlar); asıl tespit ivme modelidir
    model-tolerance: 1.12        # vanilla ivme modeli: izin verilen azami ivmenin çarpanı
    model-abs: 0.02              # ... + mutlak pay (blok/tik)
    ice-multiplier: 2.2
    mitigation: MOVE
    ban-eligible: true
    instant: true
  Timer:                         # Timer / TickShift / paket patlaması
    enabled: true
    weight: 1.0
    max-credit-ms: 800
    tolerance-ms: 100
    mitigation: MOVE
    ban-eligible: true
    instant: false
  NoFall:
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: true
    instant: true
  NoSlow:
    enabled: true
    weight: 1.0
    limit: 0.12
    ignore-materials: [SPYGLASS, GOAT_HORN, BRUSH]   # kullanımı yavaşlatmayan/şüpheli eşyalar
    mitigation: MOVE
    ban-eligible: true
    instant: true
  Scaffold:
    enabled: true
    weight: 1.0
    rate-per-20-ticks: 14
    ray-error: 0.6               # bakış ışınının tıklanan yüze izin verilen hatası (blok)
    mitigation: PLACE
    ban-eligible: true
    instant: true
  Criticals:
    enabled: true
    weight: 1.0
    mitigation: ATTACK
    ban-eligible: false
    instant: false
  ChestStealer:
    enabled: true
    weight: 1.0
    min-open-ticks: 3
    samples: 12
    min-stddev: 0.3
    mitigation: CONTAINER
    ban-eligible: false
    instant: false
  GuiMove:
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: false
    instant: false
  Rotation:                      # fare kuantizasyonu (GCD); sinematik kamera/özel istemcilerde yanlış pozitif olabilir
    enabled: true
    weight: 0.4
    window: 40
    min-step: 0.005
    mitigation: NONE
    ban-eligible: false
    instant: false
  Phase:
    enabled: true
    weight: 0.6
    mitigation: MOVE
    ban-eligible: true
    instant: true
  Jesus:                         # sıvı yüzeyinde yürüme
    enabled: true
    weight: 1.0
    ticks: 12
    mitigation: MOVE
    ban-eligible: true
    instant: true
  Spider:                        # duvara tırmanma (Fly sapması duvar yanındaysa)
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: true
    instant: true
  AimAssist:                     # nişan her vuruşta hedef merkezine fazla kilitli
    enabled: true
    weight: 0.7
    samples: 25
    max-mean: 1.2
    max-stddev: 0.7
    mitigation: ATTACK
    ban-eligible: false
    instant: false
  ElytraSpeed:                   # elytra fiziği: ElytraPlus sabit hız, boost, hız çarpanı. Vanilla elytra formülüyle doğrulanır.
    enabled: true
    weight: 1.5
    mitigation: ELYTRA+ATTACK    # elytra kapatılır (uçuş bitirilir/başlatılamaz) + saldırı engeli
    ban-eligible: true
    instant: true
    confirm-points: 3            # 1 kanıt = 1/2
    strong-points: 3             # (MEDIUM = HIGH) 2. ihlalde 2/2 DOĞRUDAN BAN
    violations-to-restrict: 1
    violations-to-ban: 2
    expire-hours: 168
    violation-cooldown-seconds: 15
    mitigation-seconds: 30
    restrict-seconds: 60
  ElytraTarget:                  # elytra + hedefe kilitli vuruş / dön-vur-geri dön / otomatik roket
    enabled: true
    weight: 1.5
    locked-degrees: 1.8          # hedef gözüne/merkezine bu kadar yakın nişan "kilitli" sayılır
    window: 6
    need: 4                      # son 6 elytra vuruşunun 4'ü kilitliyse kanıt
    rocket-samples: 6
    rocket-max-stddev-ticks: 2.5
    mitigation: ELYTRA+ATTACK
    ban-eligible: true
    instant: true
    confirm-points: 3
    strong-points: 3
    violations-to-restrict: 1
    violations-to-ban: 2
    expire-hours: 168
    violation-cooldown-seconds: 15
    mitigation-seconds: 30
    restrict-seconds: 60
